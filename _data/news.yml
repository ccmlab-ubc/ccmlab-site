- date: 2025-10-22 
  details: (October 22, 2025) Congratulations to Jack for his abstract, "Bayesian causal inference as a common principle for perception and action", being accepted at this year's <a href="http://motor-conference.org/openconf.php">Advances in Motor Learning and Motor Control (MLMC) conference</a>, where he will get to give a talk on this work! Congrats also go to Dusty for her important contributions to this project, as well as many thanks to our collaborators Mike Landy and Romeo Chua.

- date: 2025-10-22 
  details: (October 22, 2025) A belated welcome to <a href="https//ccmlab.org/people/yousun_park/index.html">Yousun Park</a>, the newest member of the CCM Lab! Yousun is a third-year Integrated Sciences major with a focus on Computer Science and Neuroscience. She will be completing her Honours Thesis in the lab this year, and we're excited to have her with us. 

- date: 2025-08-13
  details: (August 8, 2025) Very excited to announce that <a href="https://royalsocietypublishing.org/doi/full/10.1098/rspb.2025.1320">our paper on the PIECE model</a> has just been published in Proceedings of the Royal Society B! Here, we present a model of how the sensorimotor system parses total movement error into internally- and externally-generated components in order to implicitly adapt only to the latter. This phenomenon was first reported in an <a href="http://www.motor-conference.org/abstracts/228.pdf">abstract by Tanvi Ranjan & Maurice Smith</a>, where they highlighted the incredible precision with which our brains accomplish this feat. Our work indicates that highly accurate predictions, combined with causal inference and state estimation, underlie this capability. We also show that models which posit a perceptual error as the driving signal for adaptation cannot account for these results, suggesting sensory recalibration may be a correlate, rather than a cause, of implicit adaptation. Future work with PIECE aims to shed further light on these questions!

- date: 2025-06-07
  details: (June 7, 2025) Hyosub was recently awarded an <a href="https://www.nserc-crsng.gc.ca/index_eng.asp">NSERC Discovery Grant</a>, which provides 5 years of funding for the lab's research into the the computational principles underlying motor skills! Thank you, NSERC! We are also very grateful to the <a href="https://www.innovation.ca/">Canada Foundation for Innovation</a> for awarding Hyosub the John Evans Leadership Fund last year, and the B.C. government for their support through the B.C. Knowledge Development Fund (BCKDF). Thanks to these sponsors we were able to purchase a new <a href="https://kinarm.com/solutions/kinarm-end-point-lab/">KinArm Endpoint Lab</a>. We'll receive our new toy later this year when our lab, and department, move into our new home within the <a href="https://kin.educ.ubc.ca/about/gateway-building/">Gateway Building</a>.  

